<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayStation 5 Game Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --ps-blue: #00439c;
      --ps-accent-blue: #0070d1;
      --ps-neon-cyan: #00f0ff;
      --ps-light-blue: #2e6db4;
      --ps-dark-bg: #070913;
      --ps-card-bg: rgba(18, 24, 43, 0.75);
      --ps-card-border: rgba(255, 255, 255, 0.08);
      --ps-card-border-hover: rgba(0, 112, 209, 0.5);
      --ps-text-main: #f3f5fc;
      --ps-text-muted: #8b9bb4;
      --status-completed: #10b981;
      --status-playing: #3b82f6;
      --status-backlog: #8b5cf6;
      --status-wishlist: #f59e0b;
      --status-dropped: #ef4444;
      --font-body: 'Outfit', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--ps-dark-bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 67, 156, 0.28) 0%, transparent 40%),
        radial-gradient(circle at 85% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(46, 109, 180, 0.18) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--ps-text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient particles & subtle PS logo shapes */
    .ambient-glow {
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 350px;
      background: radial-gradient(ellipse, rgba(0, 112, 209, 0.25), transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(20px);
      background: rgba(7, 9, 19, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      cursor: pointer;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00439c 0%, #0070d1 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 112, 209, 0.5), inset 0 1px 1px rgba(255,255,255,0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-badge svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: var(--font-display);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title h1 span {
      background: linear-gradient(90deg, #00f0ff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--ps-text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.2rem;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0060c2 0%, #0070d1 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(0, 112, 209, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 112, 209, 0.55);
      background: linear-gradient(135deg, #0070d1 0%, #1e88e5 100%);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--ps-text-main);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Container */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* Stats Banner */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--ps-card-bg);
      border: 1px solid var(--ps-card-border);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 1.2rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--ps-card-border-hover);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .stat-info .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      font-family: var(--font-display);
      line-height: 1.1;
    }

    .stat-info .stat-label {
      font-size: 0.8rem;
      color: var(--ps-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }

    /* Controls Bar: Search, Filters, Sort */
    .controls-panel {
      background: var(--ps-card-bg);
      border: 1px solid var(--ps-card-border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .controls-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      color: var(--ps-text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--ps-accent-blue);
      box-shadow: 0 0 15px rgba(0, 112, 209, 0.35);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ps-text-muted);
      pointer-events: none;
    }

    .filter-tabs {
      display: flex;
      background: rgba(10, 14, 26, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 4px;
      overflow-x: auto;
      max-width: 100%;
    }

    .filter-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--ps-text-muted);
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-tab.active {
      background: var(--ps-accent-blue);
      color: white;
      box-shadow: 0 2px 10px rgba(0, 112, 209, 0.5);
    }

    .controls-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .secondary-filters {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .custom-select {
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      color: var(--ps-text-main);
      font-family: var(--font-body);
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .custom-select:focus {
      border-color: var(--ps-accent-blue);
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--ps-text-muted);
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background: var(--ps-card-bg);
      border: 1px solid var(--ps-card-border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.015);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 16px 36px rgba(0, 112, 209, 0.3), 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .game-cover-wrap {
      position: relative;
      width: 100%;
      height: 330px;
      overflow: hidden;
      background: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.5s ease;
    }

    .game-card:hover .game-cover {
      transform: scale(1.08);
    }

    .game-format-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .game-status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .status-in_corso { background: rgba(59, 130, 246, 0.85); color: #fff; }
    .status-completato { background: rgba(16, 185, 129, 0.85); color: #fff; }
    .status-platinato { background: linear-gradient(135deg, #818cf8, #c084fc); color: #fff; }
    .status-da_iniziare { background: rgba(139, 92, 246, 0.85); color: #fff; }
    .status-wishlist { background: rgba(245, 158, 11, 0.85); color: #fff; }
    .status-abbandonato { background: rgba(239, 68, 68, 0.85); color: #fff; }

    .game-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .game-header-area {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .game-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .game-meta {
      font-size: 0.8rem;
      color: var(--ps-text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .genre-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 2px 6px;
      color: #cbd5e1;
    }

    .game-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.82rem;
    }

    .rating-stars {
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
    }

    .playtime-badge {
      color: var(--ps-text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .trophy-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #cbd5e1;
      font-size: 0.78rem;
    }

    .trophy-badge.plat {
      color: #38bdf8;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .game-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .btn-card {
      flex: 1;
      padding: 0.45rem 0.6rem;
      font-size: 0.78rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-icon {
      padding: 0.45rem;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--ps-text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-icon.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-window {
      background: #0f1627;
      border: 1px solid rgba(0, 112, 209, 0.35);
      border-radius: 20px;
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 112, 209, 0.2);
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.open .modal-window {
      transform: scale(1);
    }

    .modal-header {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: var(--font-display);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--ps-text-muted);
      cursor: pointer;
      font-size: 1.4rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #fff;
    }

    .modal-body {
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ps-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea, .form-select {
      background: rgba(6, 10, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--ps-text-main);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--ps-accent-blue);
      box-shadow: 0 0 10px rgba(0, 112, 209, 0.3);
    }

    .modal-footer {
      padding: 1.25rem 1.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      background: rgba(6, 10, 20, 0.4);
    }

    /* Preset cover buttons */
    .preset-covers {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .preset-cover-thumb {
      width: 54px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.7;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .preset-cover-thumb:hover, .preset-cover-thumb.selected {
      opacity: 1;
      border-color: var(--ps-neon-cyan);
      transform: scale(1.05);
    }

    .preset-cover-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--ps-card-bg);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 15px rgba(0, 112, 209, 0.4));
    }

    .empty-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .empty-desc {
      color: var(--ps-text-muted);
      font-size: 0.9rem;
      max-width: 420px;
      margin: 0 auto 1.5rem auto;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #0f182b;
      border: 1px solid var(--ps-accent-blue);
      color: white;
      padding: 0.9rem 1.4rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 112, 209, 0.4);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 1rem;
      }
      main {
        padding: 1rem;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      .brand-title p {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="brand" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm4 0h-2v-6h2v6zm-4-8h-2V7h2v2zm4 0h-2V7h2v2z"/>
          </svg>
        </div>
        <div class="brand-title">
          <h1>PS5 <span>VAULT</span></h1>
          <p>Libreria Personale PlayStation 5</p>
        </div>
      </div>

      <div class="header-actions">
        <span id="cloudStatusBadge" style="display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; padding:0.4rem 0.8rem; border-radius:20px; background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); color:#34d399; font-weight:600;">
          <span style="width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 8px #10b981;"></span>
          Cloud Supabase
        </span>

    // Supabase Configuration
    const SUPABASE_URL = 'https://czbeweslykntgqywplrr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NVfiAmHluZNMec_fKHTA-Q_2apTDkRG';
    let supabaseClient = null;

    if (window.supabase) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.warn('Could not initialize Supabase SDK:', err);
      }
    }

    // State
    let games = [];
    let activeStatusFilter = 'all';

    function updateCloudStatus(status, text) {
      const badge = document.getElementById('cloudStatusBadge');
      if (!badge) return;
      if (status === 'connected') {
        badge.innerHTML = `<span style="width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 8px #10b981;"></span> ${text || 'Cloud Supabase'}`;
        badge.style.color = '#34d399';
        badge.style.borderColor = 'rgba(16,185,129,0.4)';
        badge.style.background = 'rgba(16,185,129,0.15)';
      } else if (status === 'syncing') {
        badge.innerHTML = `<span style="width:8px; height:8px; border-radius:50%; background:#3b82f6; box-shadow:0 0 8px #3b82f6;"></span> Sincronizzazione...`;
        badge.style.color = '#60a5fa';
        badge.style.borderColor = 'rgba(59,130,246,0.4)';
        badge.style.background = 'rgba(59,130,246,0.15)';
      } else {
        badge.innerHTML = `<span style="width:8px; height:8px; border-radius:50%; background:#f59e0b;"></span> Offline Local`;
        badge.style.color = '#fbbf24';
        badge.style.borderColor = 'rgba(245,158,11,0.4)';
        badge.style.background = 'rgba(245,158,11,0.15)';
      }
    }

    async function loadFromSupabase(showToastAlert = false) {
      updateCloudStatus('syncing');
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/games?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          games = data.map(dbItem => ({
            id: dbItem.id,
            title: dbItem.title,
            status: dbItem.status,
            format: dbItem.format,
            genre: dbItem.genre,
            developer: dbItem.developer,
            hours: parseFloat(dbItem.hours) || 0,
            rating: dbItem.rating !== null ? parseFloat(dbItem.rating) : null,
            trophies: parseInt(dbItem.trophies, 10) || 0,
            platinum: !!dbItem.platinum,
            coverUrl: dbItem.cover_url || getOfficialCoverForTitle(dbItem.title),
            notes: dbItem.notes || '',
            createdAt: parseInt(dbItem.created_at, 10) || Date.now()
          }));
          saveToLocalStorage();
          renderGames();
          updateStats();
          updateCloudStatus('connected', `Cloud: ${games.length} giochi`);
          if (showToastAlert) showToast('☁️ Sincronizzato con Supabase DB!');
          return;
        }
      } catch (err) {
        console.warn('Supabase fetch fallback to local storage:', err);
        updateCloudStatus('offline');
      }

      // Fallback local storage
      loadFromLocalStorage();
    }

    function loadFromLocalStorage() {
      let loadedGames = null;
      try {
        const stored = localStorage.getItem('ps5_games_library_v5');
        if (stored) loadedGames = JSON.parse(stored);
      } catch (e) {
        console.error(e);
      }

      if (!loadedGames || loadedGames.length === 0) {
        games = JSON.parse(JSON.stringify(INITIAL_GAMES));
      } else {
        games = loadedGames;
      }

      saveToLocalStorage();
      renderGames();
      updateStats();
    }

    async function syncGameToCloud(gameItem, isDelete = false) {
      try {
        if (isDelete) {
          await fetch(`${SUPABASE_URL}/rest/v1/games?id=eq.${encodeURIComponent(gameItem.id)}`, {
            method: 'DELETE',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
          });
        } else {
          const payload = {
            id: gameItem.id,
            title: gameItem.title,
            status: gameItem.status,
            format: gameItem.format,
            genre: gameItem.genre,
            developer: gameItem.developer,
            hours: gameItem.hours,
            rating: gameItem.rating,
            trophies: gameItem.trophies,
            platinum: gameItem.platinum,
            cover_url: gameItem.coverUrl,
            notes: gameItem.notes,
            created_at: gameItem.createdAt
          };

          await fetch(`${SUPABASE_URL}/rest/v1/games`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify(payload)
          });
        }
      } catch (err) {
        console.warn('Could not sync item to cloud:', err);
      }
    }

    function init() {
      renderPresetThumbnails();
      loadFromLocalStorage();
      // Asynchronously fetch from Supabase Cloud
      loadFromSupabase(false);
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem('ps5_games_library_v5', JSON.stringify(games));
      } catch (e) {
        console.error('Failed to save', e);
      }
    }

    function renderPresetThumbnails() {
      const container = document.getElementById('presetCoversList');
      container.innerHTML = PRESET_COVERS.map(p => `
        <div class="preset-cover-thumb" title="${p.name}" onclick="selectPresetCover('${p.url}')">
          <img src="${p.url}" alt="${p.name}">
        </div>
      `).join('');
    }

    function selectPresetCover(url) {
      document.getElementById('gameCoverUrl').value = url;
    }

    function setStatusFilter(status) {
      activeStatusFilter = status;
      document.querySelectorAll('#statusFilterTabs .filter-tab').forEach(tab => {
        tab.classList.toggle('active', tab.getAttribute('data-status') === status);
      });
      renderGames();
    }

    function updateStats() {
      const total = games.length;
      const inCorso = games.filter(g => g.status === 'in_corso').length;
      const completati = games.filter(g => g.status === 'completato' || g.status === 'platinato').length;
      const totalHours = games.reduce((acc, g) => acc + (parseFloat(g.hours) || 0), 0);

      document.getElementById('statTotalGames').textContent = total;
      document.getElementById('statInCorso').textContent = inCorso;
      document.getElementById('statCompletati').textContent = completati;
      document.getElementById('statTotalHours').textContent = totalHours % 1 === 0 ? totalHours + 'h' : totalHours.toFixed(1) + 'h';
    }

    function getStatusLabel(status) {
      switch (status) {
        case 'in_corso': return 'In Corso';
        case 'completato': return 'Completato';
        case 'platinato': return 'Platino 🏆';
        case 'da_iniziare': return 'Backlog';
        case 'wishlist': return 'Wishlist';
        case 'abbandonato': return 'Abbandonato';
        default: return status;
      }
    }

    function renderGames() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const format = document.getElementById('formatFilter').value;
      const genre = document.getElementById('genreFilter').value;
      const sortBy = document.getElementById('sortFilter').value;

      let filtered = games.filter(game => {
        // Status filter
        if (activeStatusFilter !== 'all' && game.status !== activeStatusFilter) {
          return false;
        }
        // Format filter
        if (format !== 'all' && game.format !== format) {
          return false;
        }
        // Genre filter
        if (genre !== 'all' && (!game.genre || !game.genre.toLowerCase().includes(genre.toLowerCase()))) {
          return false;
        }
        // Search filter
        if (search) {
          const matchTitle = game.title.toLowerCase().includes(search);
          const matchGenre = (game.genre || '').toLowerCase().includes(search);
          const matchDev = (game.developer || '').toLowerCase().includes(search);
          const matchNotes = (game.notes || '').toLowerCase().includes(search);
          if (!matchTitle && !matchGenre && !matchDev && !matchNotes) {
            return false;
          }
        }
        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (sortBy === 'title_asc') return a.title.localeCompare(b.title);
        if (sortBy === 'title_desc') return b.title.localeCompare(a.title);
        if (sortBy === 'rating_desc') return (b.rating || 0) - (a.rating || 0);
        if (sortBy === 'hours_desc') return (b.hours || 0) - (a.hours || 0);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const container = document.getElementById('gamesContainer');
      document.getElementById('resultsCount').textContent = `Visualizzazione ${filtered.length} di ${games.length} giochi`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎮</div>
            <div class="empty-title">Nessun gioco trovato</div>
            <div class="empty-desc">Non ci sono titoli che corrispondono ai filtri o alla ricerca selezionata.</div>
            <button class="btn btn-primary" onclick="openAddGameModal()">Aggiungi un Gioco Ora</button>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(game => {
        const cover = game.coverUrl || 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80';
        const genres = (game.genre || '').split(',').map(s => s.trim()).filter(Boolean);

        return `
          <div class="game-card">
            <div class="game-cover-wrap">
              <img src="${cover}" alt="${game.title}" class="game-cover" loading="lazy">
              <div class="game-format-badge">
                ${game.format === 'Disco' ? '💿' : game.format === 'Digitale' ? '💾' : '⭐'} ${game.format}
              </div>
              <div class="game-status-badge status-${game.status}">
                ${getStatusLabel(game.status)}
              </div>
            </div>

            <div class="game-info">
              <div class="game-header-area">
                <h4 class="game-title">${escapeHtml(game.title)}</h4>
                <div class="game-meta">
                  ${game.developer ? `<span>🏢 ${escapeHtml(game.developer)}</span>` : ''}
                </div>
                ${genres.length > 0 ? `
                  <div class="game-genres">
                    ${genres.map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('')}
                  </div>
                ` : ''}
              </div>

              ${game.notes ? `
                <p style="font-size:0.8rem; color:var(--ps-text-muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                  ${escapeHtml(game.notes)}
                </p>
              ` : ''}

              <div class="game-stats-row">
                <div class="rating-stars">
                  ${game.rating ? `⭐ ${game.rating}<span style="font-size:0.7rem; color:var(--ps-text-muted);">/10</span>` : '<span style="color:var(--ps-text-muted); font-size:0.75rem;">N/D</span>'}
                </div>
                <div class="playtime-badge">
                  ⏱️ ${game.hours ? game.hours + 'h' : '0h'}
                </div>
                <div class="trophy-badge ${game.platinum ? 'plat' : ''}">
                  ${game.platinum ? '🏆 Platino' : `🎯 ${game.trophies || 0}%`}
                </div>
              </div>

              <div class="game-actions">
                <button class="btn btn-secondary btn-card" onclick="editGame('${game.id}')">
                  ✏️ Modifica
                </button>
                <button class="btn btn-secondary btn-card" onclick="quickCycleStatus('${game.id}')" title="Avanza stato rapido">
                  🔄 Avanza
                </button>
                <button class="btn-icon delete" onclick="deleteGame('${game.id}')" title="Elimina dalla libreria">
                  🗑️
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function openAddGameModal() {
      document.getElementById('modalTitle').textContent = '➕ Nuovo Gioco PS5';
      document.getElementById('editGameId').value = '';
      document.getElementById('gameTitle').value = '';
      document.getElementById('gameStatus').value = 'in_corso';
      document.getElementById('gameFormat').value = 'Digitale';
      document.getElementById('gameGenre').value = '';
      document.getElementById('gameDeveloper').value = '';
      document.getElementById('gameHours').value = '';
      document.getElementById('gameRating').value = '';
      document.getElementById('gameTrophies').value = '';
      document.getElementById('gamePlatCheckbox').checked = false;
      document.getElementById('gameCoverUrl').value = '';
      document.getElementById('gameNotes').value = '';

      document.getElementById('gameModal').classList.add('open');
      setTimeout(() => document.getElementById('gameTitle').focus(), 150);
    }

    function editGame(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      document.getElementById('modalTitle').textContent = '✏️ Modifica ' + game.title;
      document.getElementById('editGameId').value = game.id;
      document.getElementById('gameTitle').value = game.title || '';
      document.getElementById('gameStatus').value = game.status || 'in_corso';
      document.getElementById('gameFormat').value = game.format || 'Digitale';
      document.getElementById('gameGenre').value = game.genre || '';
      document.getElementById('gameDeveloper').value = game.developer || '';
      document.getElementById('gameHours').value = game.hours !== undefined ? game.hours : '';
      document.getElementById('gameRating').value = game.rating !== undefined ? game.rating : '';
      document.getElementById('gameTrophies').value = game.trophies !== undefined ? game.trophies : '';
      document.getElementById('gamePlatCheckbox').checked = !!game.platinum;
      document.getElementById('gameCoverUrl').value = game.coverUrl || '';
      document.getElementById('gameNotes').value = game.notes || '';

      document.getElementById('gameModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('gameModal').classList.remove('open');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'gameModal') {
        closeModal();
      }
    }

    function saveGame() {
      const title = document.getElementById('gameTitle').value.trim();
      if (!title) {
        showToast('⚠️ Inserisci un titolo per il gioco');
        return;
      }

      const editId = document.getElementById('editGameId').value;
      const isPlat = document.getElementById('gamePlatCheckbox').checked;
      let status = document.getElementById('gameStatus').value;
      if (isPlat && status !== 'platinato') {
        status = 'platinato';
      }

      // Auto-assign official cover if input is empty or generic
      let coverUrl = document.getElementById('gameCoverUrl').value.trim();
      if (!coverUrl) {
        coverUrl = getOfficialCoverForTitle(title) || 'https://image.api.playstation.com/vulcan/ap/rnd/202306/1219/1c7b75d8ed9271516546560d219ad0b22ee0a263b4537bd8.png';
      }

      const gameData = {
        title: title,
        status: status,
        format: document.getElementById('gameFormat').value,
        genre: document.getElementById('gameGenre').value.trim(),
        developer: document.getElementById('gameDeveloper').value.trim(),
        hours: parseFloat(document.getElementById('gameHours').value) || 0,
        rating: parseFloat(document.getElementById('gameRating').value) || null,
        trophies: parseInt(document.getElementById('gameTrophies').value, 10) || (isPlat ? 100 : 0),
        platinum: isPlat,
        coverUrl: coverUrl,
        notes: document.getElementById('gameNotes').value.trim(),
      };

      if (isPlat) {
        triggerConfetti();
      }

      let savedItem = null;
      if (editId) {
        const index = games.findIndex(g => g.id === editId);
        if (index !== -1) {
          games[index] = { ...games[index], ...gameData };
          savedItem = games[index];
          showToast('✅ Gioco aggiornato con successo!');
        }
      } else {
        const newGame = {
          id: 'game-' + Date.now(),
          ...gameData,
          createdAt: Date.now()
        };
        games.unshift(newGame);
        savedItem = newGame;
        showToast('🎉 Nuovo gioco aggiunto alla libreria PS5!');
      }

      saveToLocalStorage();
      if (savedItem) {
        syncGameToCloud(savedItem, false);
      }
      closeModal();
      renderGames();
      updateStats();
    }

    function resetToOfficialCollection() {
      games = JSON.parse(JSON.stringify(INITIAL_GAMES));
      saveToLocalStorage();
      // Sync all initial to cloud
      for (const g of games) {
        syncGameToCloud(g, false);
      }
      renderGames();
      updateStats();
      showToast('🔄 Libreria ripristinata con i 13 giochi ufficiali PS5!');
    }

    function quickCycleStatus(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      const order = ['da_iniziare', 'in_corso', 'completato', 'platinato'];
      let nextIndex = order.indexOf(game.status) + 1;
      if (nextIndex >= order.length || nextIndex === 0) {
        nextIndex = 0;
      }

      game.status = order[nextIndex];
      if (game.status === 'platinato') {
        game.platinum = true;
        game.trophies = 100;
        triggerConfetti();
        showToast(`🏆 Complimenti! Platino sbloccato su ${game.title}`);
      } else if (game.status === 'completato') {
        showToast(`✅ ${game.title} segnato come Completato!`);
      }

      saveToLocalStorage();
      syncGameToCloud(game, false);
      renderGames();
      updateStats();
    }

    function deleteGame(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      if (confirm(`Sei sicuro di voler rimuovere "${game.title}" dalla tua libreria PS5?`)) {
        games = games.filter(g => g.id !== id);
        saveToLocalStorage();
        syncGameToCloud(game, true);
        renderGames();
        updateStats();
        showToast('🗑️ Gioco rimosso dalla libreria');
      }
    }

    function triggerConfetti() {
      if (window.confetti) {
        window.confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#00f0ff', '#0070d1', '#c084fc', '#ffffff']
        });
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(games, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ps5-library-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('💾 Backup della libreria esportato');
    }

    function importDataTrigger() {
      document.getElementById('importFileInput').click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed)) {
            games = parsed;
            saveToLocalStorage();
            renderGames();
            updateStats();
            showToast('📥 Libreria ripristinata con successo!');
          } else {
            alert('Formato file non valido. Atteso un array di giochi.');
          }
        } catch (err) {
          alert('Errore nella lettura del file JSON.');
        }
      };
      reader.readAsText(file);
    }

    // Keyboard shortcut ESC for modal
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
